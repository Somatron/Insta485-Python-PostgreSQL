<!DOCTYPE html>
<html lang="en">
  <head>
    <title>insta485</title>
    <link rel="stylesheet" href="/css/style.css/style.css">
  </head>
  <body>

    <div class="Insta-Header">
      <a href="/"><img class="insta-logo" src="/images/Instagram-2018-Logo-Vector.png" ></a>
      <p class="explore-user"> <a href="/explore/index.html">explore</a> | <a href="/users/{{logname}}/">{{logname}}</a></p>
    </div>

    <div class="Post-Details">
      <img class="Post-Image-Details" src="{{img_url}}">
      <div class="userpost-Details">
        <img class="user-profile-Details" src="{{owner_img_url}}">
        <p class="post-username-Details">
          <a href="/users/{{owner}}/">{{owner}}</a>
        </p>
        <p class="post-time-Details">{{timestamp}}</p>      
      </div>
      
      <p class="display-likes">{{likes}} {{'likes' if likes != 1 else 'like'}}</p>

      {% for unique_comment in comments %}
      <div class="user-comment-Details">
        <div class="comment-username">{{ unique_comment.owner }}</div>
        <div class="comment-type">{{ unique_comment.text }}</div>
      </div>
      {% endfor %}


    </div>
  </body>
</html>
